name: BioWatch — 한국 바이오/제약 공시 추적

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '몇 시간 이전부터 스캔 (기본: 2, 테스트용 48 입력 가능)'
        required: false
        default: '2'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 캐시 복원 (seen.db)
        uses: actions/cache@v4
        with:
          path: data/seen.db
          key: biowatch-seen-db-${{ github.run_id }}
          restore-keys: |
            biowatch-seen-db-

      - name: BioWatch 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
        run: python main.py --hours ${{ github.event.inputs.hours || '2' }}

      - name: 캐시 저장 (seen.db)
        if: always()
        uses: actions/cache@v4
        with:
          path: data/seen.db
          key: biowatch-seen-db-${{ github.run_id }}
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 30일마다 빈 커밋으로 액션 유지
        run: |
          git config user.email "biowatch-bot@github.com"
          git config user.name "BioWatch Bot"
          LAST=$(git log -1 --format="%ct")
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          if [ $DAYS -ge 30 ]; then
            git commit --allow-empty -m "chore: keep-alive [skip ci]"
            git push
          fi
